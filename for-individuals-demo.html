<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seattle Composers Alliance · SCALE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F0F5F6; --ink:#3E3745; --muted:#6E6873; --faint:#9A95A0;
  --line:#D7E1E1; --surface:#FAFCFC; --surface2:#EAF1F1;
  --teal:#007E70; --teal-bright:#00CCB8; --teal-soft:#DDEFEC; --teal-ink:#007E70; --teal-hover:#1DD8C4;
  --income:#0A8466; --expense:#B8472B; --neutral:#6E6873; --warn:#B07A16; --warn-soft:#FBF2DC; --other:#7A6A2E;
  --shadow:0 1px 2px rgba(60,55,68,.07),0 4px 16px rgba(60,55,68,.06);
  --sans:'Montserrat',ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:'Montserrat',ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--teal-ink);text-decoration:none}
a:hover{color:var(--teal-hover);text-decoration:underline}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* layout */
#app{display:grid;grid-template-columns:212px 1fr;height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:baseline;gap:8px;padding:4px 8px 14px}
.brand b{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:10px;color:var(--teal-ink);background:var(--teal-soft);padding:2px 6px;border-radius:5px;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:8px;font-weight:500;font-size:13.5px}
.nav button .ico{width:18px;text-align:center;font-size:15px;opacity:.85}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.active{background:var(--teal-soft);color:var(--teal-ink);font-weight:600}
.nav .badge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--warn-soft);color:var(--warn);padding:1px 6px;border-radius:20px}
.nav button.navgroup{color:var(--muted)}
.nav button.navgroup.active-parent{color:var(--ink);font-weight:600}
.nav .chev{margin-left:auto;opacity:.55;font-size:10px}
.nav button.sub{padding-left:34px;font-size:13px}
.nav button.sub .ico{font-size:13px;opacity:.7}
.rail .foot{margin-top:auto;font-size:11px;color:var(--faint);padding:8px}
.storage{font-size:11px;padding:8px 10px;border-radius:8px;line-height:1.35}
.storage.ok{background:var(--surface2);color:var(--muted)}
.storage.warn{background:var(--warn-soft);color:var(--warn)}

main{min-width:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.tape{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.tape .stat{display:flex;flex-direction:column;gap:1px}
.tape .stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600}
.tape .stat .v{font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:-.01em}
.v.in{color:var(--income)} .v.out{color:var(--expense)} .v.net{color:var(--ink)}
.tape .spacer{flex:1}
.period{display:flex;align-items:center;gap:6px}
.period select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-family:var(--mono);font-size:12px}
.flag-pill{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:20px;background:var(--warn-soft);color:var(--warn);cursor:pointer;border:0}
.flag-pill.zero{background:var(--surface2);color:var(--faint);cursor:default}

.view{padding:24px 26px 80px;max-width:1700px}
h2.title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px;max-width:96ch}

/* cards & buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:#00998A;border-color:#00998A}
.btn.primary:hover{background:var(--teal-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--teal-ink);padding:8px 8px}
.btn.ghost:hover{background:var(--teal-soft)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--expense);border-color:transparent}
.btn.danger:hover{background:#F6E7E1}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
label.fld input,label.fld select,label.fld textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
label.fld textarea{resize:vertical;min-height:38px;line-height:1.4}
.noteinp{display:block;width:100%;box-sizing:border-box;margin-top:4px;font-size:11.5px;padding:3px 7px;border:1px dashed var(--line);border-radius:6px;background:transparent;color:var(--muted)}
.noteinp:focus{border-style:solid;border-color:var(--teal);color:var(--ink);outline:none}
.noteinp::placeholder{color:var(--muted);opacity:.7}
.navundo{display:flex;gap:6px;margin:10px 0 4px}
.navundobtn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 4px;font-size:11.5px;color:var(--ink);cursor:pointer;font-family:inherit}
.navundobtn:hover:not(:disabled){border-color:var(--teal);color:var(--teal-ink)}
.navundobtn:disabled{opacity:.4;cursor:default}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.edit-num{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--surface)}
.edit-num:hover{border-color:var(--teal)}
.editline{display:inline-flex;align-items:center;gap:4px}
.edit-hint{color:var(--teal-ink);font-size:11px;font-style:normal}

/* dropzone */
.drop{border:1.5px dashed #C8CEC6;border-radius:var(--r);background:var(--surface2);padding:34px;text-align:center;transition:.15s}
.drop.hot{border-color:var(--teal);background:var(--teal-soft)}
.drop .big{font-size:16px;font-weight:600}
.drop .hint{color:var(--muted);font-size:12.5px;margin-top:6px}

/* receipt tape (signature) */
.receipt{font-family:var(--mono);background:var(--ink);color:#E9EBE6;border-radius:var(--r);padding:16px 18px;font-size:12.5px;line-height:1.8;box-shadow:var(--shadow);overflow:auto}
.receipt .hr{border-top:1px dashed #5A5563;margin:8px 0}
.receipt .ok{color:#00CCB8}
.receipt .bad{color:#E59C86}
.receipt .lbl{color:#A7AEBA}
.receipt b{color:#fff}
.receipt .warnbox b,.receipt .okbox b{color:inherit}
.receipt .btn.ghost{color:#00CCB8;border:1px solid #5A5563;background:transparent}
.receipt .btn.ghost:hover{background:rgba(255,255,255,.06)}

/* table */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.no-sort{cursor:default}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.dupe{background:var(--warn-soft)}
td.amt{text-align:right;white-space:nowrap}
td.amt.income{color:var(--income)} td.amt.expense{color:var(--expense)} td.amt.neutral{color:var(--neutral)}
td.date{white-space:nowrap;color:var(--muted)}
.desc{max-width:380px}
.desc small{display:block;color:var(--faint);font-size:11px}
.catpill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);cursor:pointer}
.catpill.income{background:#E8F3EC;border-color:#CDE6D6;color:var(--income)}
.catpill.expense{background:#F7E9E3;border-color:#EAD3C8;color:var(--expense)}
.catpill.neutral{background:#EEF0F2;border-color:#DEE1E6;color:var(--neutral)}
.catpill.none{border-style:dashed;color:var(--warn);background:var(--warn-soft);border-color:#E7D7B0}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:10.5px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);padding:1px 6px;border-radius:5px}
.empty{padding:48px;text-align:center;color:var(--muted)}
.empty .big{font-size:16px;color:var(--ink);font-weight:600;margin-bottom:6px}

/* filters bar */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input[type=search],.filters select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);font-size:12.5px}
.filters input[type=search]{min-width:200px}
.chip-toggle{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 11px;font-weight:600;color:var(--muted)}
.chip-toggle.on{background:var(--teal-soft);border-color:#BCE3DC;color:var(--teal-ink)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,24,32,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.dlg{background:var(--surface);border-radius:14px;box-shadow:0 12px 48px rgba(20,24,32,.25);width:min(560px,100%);max-height:88vh;overflow:auto}
.dlg header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:between;gap:10px}
.dlg header h3{margin:0;font-size:16px;font-weight:700;flex:1}
.dlg .body{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg .actions{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--surface2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.tagedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagedit .tag{cursor:default;display:inline-flex;gap:5px;align-items:center;font-size:11px;padding:3px 8px}
.tagedit .tag b{cursor:pointer;color:var(--expense)}
.split-row{display:grid;grid-template-columns:minmax(0,1fr) 90px auto 28px;gap:6px;align-items:center}.split-row>select,.split-row>input{min-width:0;width:100%}
.muted-note{font-size:12px;color:var(--muted)}
.warnbox{background:var(--warn-soft);border:1px solid #E7D7B0;color:#7a5a12;border-radius:8px;padding:10px 12px;font-size:12.5px}

/* rules */
.rule{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:8px}
.rule.off{opacity:.5}
.rule .when{font-size:13px}
.rule .when code{font-family:var(--mono);font-size:12px;background:var(--surface2);padding:1px 5px;border-radius:4px}
.rule .arrow{color:var(--faint);margin:0 4px}
.rule .ctrls{display:flex;gap:2px}
.iconbtn{border:0;background:transparent;color:var(--muted);padding:5px 7px;border-radius:6px;font-size:13px}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}

/* toast */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);font-weight:500}
.toast.good{background:var(--teal-ink)}

/* summary */
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sumtable td:last-child{text-align:right}
.sumtable .total td{font-weight:700;border-top:2px solid var(--line)}
.kpi{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:18px}
.tvbuckets{display:grid;gap:12px;align-items:start;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1200px){.tvbuckets{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.tvbuckets{grid-template-columns:1fr}}
.kpi .b{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em}

@media (max-width:820px){
  #app{grid-template-columns:1fr;height:auto}
  main{height:auto;overflow:visible}
  .rail{position:static;height:auto;overflow:visible;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px}
  .rail .brand{padding:4px 8px;width:100%}
  .nav{flex-direction:row;flex-wrap:wrap}
  .rail .foot,.storage{display:none}
  .nav button{padding:7px 10px}
  .sumgrid{grid-template-columns:1fr}
  .view{padding:18px 16px 80px}
  .tape{padding:12px 16px;gap:16px}
}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600}
td.amt.other{color:var(--other)}
.catpill.other{background:#F3EFD9;border-color:#E6DDB4;color:var(--other)}
.delx{border:0;background:transparent;color:var(--faint);font-size:16px;line-height:1;padding:2px 7px;border-radius:6px}
.delx:hover{background:#F6E7E1;color:var(--expense)}
.bulkbar{display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:8px;padding:8px 14px;margin-bottom:10px;font-size:13px}
.bulkbar .btn{background:transparent;border-color:#3a3f4b;color:#fff}
.bulkbar .btn:hover{background:#2a2f3b}
.matrix{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.matrix table{font-size:12.5px}
.matrix th,.matrix td{padding:8px 10px;white-space:nowrap}
.matrix td.num{text-align:right}
.tbl-wrap td.num:not(.date){text-align:right}
.matrix tbody th{position:sticky;left:0;background:var(--surface);text-align:left;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink);font-weight:600;cursor:default;z-index:1}
.matrix .mcol{cursor:pointer}
.matrix .mcol:hover{color:var(--teal-ink)}
.matrix tr.subtot td,.matrix tr.subtot th{font-weight:700;border-top:1px solid var(--line);color:var(--ink)}
.matrix tr.netrow td,.matrix tr.netrow th{border-top:2px solid var(--line);font-weight:700}
.matrix .totcol{background:var(--surface2);font-weight:600}
.swatch{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:middle}
.okbox{background:var(--teal-soft);border:1px solid #BCE3DC;color:var(--teal-ink);border-radius:8px;padding:12px 14px;font-size:12.5px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);background:var(--teal);color:#fff;font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600}
.cat-group{margin-bottom:16px}
.cat-group h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:6px}
.cat-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--surface)}
.cat-item .nm{flex:1;font-weight:500}
.sugg-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto}
.sugg-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.receipt .capline{display:flex;align-items:baseline;gap:6px;font-size:11.5px;line-height:1.55}
.desc-text{cursor:text;border-bottom:1px dashed transparent;border-radius:2px}
.desc-text:hover{border-bottom-color:var(--muted)}
.desc-inline{width:100%;min-width:150px;font:inherit;padding:2px 5px;border:1px solid var(--teal);border-radius:5px;background:var(--surface)}
.cat-item.unused{opacity:.55}
.cat-item .form{font-family:var(--mono);font-size:10.5px;color:var(--teal-ink);background:var(--teal-soft);padding:1px 6px;border-radius:5px}

.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 20px;flex-wrap:wrap}
.subtab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 16px;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:-1px;border-radius:0;cursor:pointer}
.subtab:hover{color:var(--ink)}
.subtab.on{color:var(--teal-ink);border-bottom-color:var(--teal)}
/* ===== embedded Time & Mileage views (scoped; palette shared with finance) ===== */
.scaletime table{border-collapse:collapse;width:100%}
.scaletime .card{padding:16px;margin-bottom:16px}
.scaletime .card:last-child{margin-bottom:0}
.scaletime th,.scaletime td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.scaletime th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600}
.scaletime td.r,.scaletime th.r{text-align:right}
.scaletime .bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;min-width:80px;position:relative}
.scaletime .bar>i{display:block;height:100%;border-radius:5px}
.scaletime .pill{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;letter-spacing:.02em}
.scaletime .pill.paid{background:var(--teal-soft);color:var(--teal-ink)}
.scaletime .pill.unpaid{background:#EEE;color:var(--muted)}
.scaletime .kpi{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 4px}
.scaletime .kpi .box{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.scaletime .kpi.kpi4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.scaletime .kpi.kpi4 .box{flex:none;min-width:0;padding:11px 12px}
.scaletime .kpi.kpi4 .box .val{font-size:20px}
@media (max-width:520px){.scaletime .kpi.kpi4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scaletime .kpi .box .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;margin-bottom:3px}
.scaletime .kpi .box .val{font-size:22px;font-weight:700;font-family:var(--mono)}
.scaletime .ins{display:block}
.scaletime .cal-wrap{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.scaletime .cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.scaletime .cal{display:grid;grid-template-columns:repeat(7,24px);gap:2px}
.scaletime .cal-dn{font-size:10px;color:var(--faint);text-align:center;font-weight:600;padding-bottom:2px}
.scaletime .cal-d{height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:5px;cursor:pointer;color:var(--ink)}
.scaletime .cal-d:hover{background:var(--surface2)}
.scaletime .cal-d.empty{visibility:hidden;cursor:default}
.scaletime .cal-d.in{background:var(--teal-soft);color:var(--teal-ink);font-weight:600}
.scaletime .cal-d.today{outline:1.5px solid var(--teal)}
.scaletime .grid-wrap{overflow-x:auto}
.scaletime table.daily td,.scaletime table.daily th{text-align:right;white-space:nowrap;padding:5px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.scaletime table.daily td.lab,.scaletime table.daily th.lab{text-align:left;font-weight:600;position:sticky;left:0;background:var(--surface)}
.scaletime table.daily th.today,.scaletime table.daily td.today{background:var(--teal-soft)}
.scaletime table.daily .wk{border-left:2px solid var(--line);font-weight:700}

function ruleMatches(r,t){
  const hay = (r.field==="description"? (t.description||"") : String(t.amount||"")).toLowerCase();
  if(r.test==="contains") return String(r.value||"").split(",").map(s=>s.trim().toLowerCase()).filter(Boolean).some(k=>hay.includes(k));
  if(r.test==="regex"){ try{ return new RegExp(r.value,"i").test(hay); }catch(e){ return false; } }
  if(r.test==="amount_over") return Math.abs(t.amount)>parseFloat(r.value||0);
  if(r.test==="amount_under") return Math.abs(t.amount)<parseFloat(r.value||0);
  return false;
}
function classify(t){

    if(ORG_BUILD&&r.setProgram) t.program=r.setProgram;
    if(r.setTags&&r.setTags.length){ t.tags=[...new Set([...(t.tags||[]),...r.setTags])]; }
    if(r.setAccount) t.account=r.setAccount;
    if(r.note&&!t.note) t.note=r.note;

  return null;
}

/* ---------- dedupe ---------- */
function dupeKey(t){ return ymOf(t.date)+"|"+t.date+"|"+(t.amount||0).toFixed(2)+"|"+normDesc(t.description); }
function flagDupes(incoming){
  const existing=new Map(); for(const t of S.txns) existing.set(dupeKey(t),t.id);
  const seenInBatch=new Map();
  for(const t of incoming){
    const k=dupeKey(t);
    if(existing.has(k)||seenInBatch.has(k)){ t.dupe=true; t.dupeOf=existing.get(k)||seenInBatch.get(k); }
    seenInBatch.set(k,t.id);
  }
  return incoming.filter(t=>t.dupe).length;
}

function ingest(rows, accountId, source, markReview, sourceFile){
  // rows: {date(ISO), amount(signed number), description, note?}
  const txns = rows.map(r=>({ id:uid(), date:r.date, amount:r.amount, description:r.description,
    account:accountId, category:null, tags:[], splits:null, note:r.note||"", source, sourceFile:sourceFile||null, fromPaste:!!markReview, importedAt:Date.now(), dupe:false, dupeOf:null }));
  txns.forEach(classify);
  const nd=flagDupes(txns);
  S.txns.push(...txns);
  S.txns.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  persist();
  return {count:txns.length, dupes:nd, uncategorized:txns.filter(t=>!t.category&&!t.dupe).length};

function parsePastedText(text, yearOverride){

  const dy=detectYear(text);
  // Trust a year read from the statement's own anchors; otherwise fall back to the year the user typed.
  const anchored=/closing date|statement date|to\s+\d{1,2}\/\d{1,2}\/\d{4}|(january|february|march|april|may|june|july|august|september|october|november|december)\s+\d{1,2},\s*\d{4}/i.test(text);
  const year=anchored?dy.year:((+yearOverride)||dy.year); const refMonth=anchored?dy.month:12;
  const last4=detectAccountLast4(text);
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const CREDIT_KW=/thank you|online payment|payment received|payment thank|reversal|refund|credit balance|cash ?back|rewards/i;
  const cleanDesc=d=> d.replace(/^(?:\d{1,2}\/\d{1,2}\s+){1,2}/,"")

    let sign=-1;

      const dm=ln.match(/(\d{1,2})\/(\d{1,2})/); if(!dm)continue;
      const nums=ln.match(/[\d,]+\.\d{2}/g); if(!nums)continue;
      const amt=parseFloat(nums[nums.length-1].replace(/,/g,""));

      const mm=+dm[1],dd=+dm[2],y=mm>refMonth?year-1:year;

  const IN=/\bfrom |deposit|cashback|cash back|rewards|refund|return|interest|thank you|online payment|payment received|reversal/i;
  let cur=null; const recs=[];
  const flush=()=>{if(cur)recs.push(cur);cur=null;};
  for(const ln of lines){
    const dm=ln.match(/^(\d{1,2})\/(\d{1,2})\b/);
    if(dm){flush();const nums=ln.match(/[\d,]+\.\d{2}/g)||[];cur={mm:+dm[1],dd:+dm[2],raw:ln,nums:nums.map(n=>parseFloat(n.replace(/,/g,"")))};}
    else if(cur){cur.raw+=" "+ln;const more=ln.match(/[\d,]+\.\d{2}/g);if(more)cur.nums.push(...more.map(n=>parseFloat(n.replace(/,/g,""))));}
  }
  flush();
  let prevBal=null;
  for(const rec of recs){
    if(!rec.nums.length)continue;
    let amount,balance=null;
    if(rec.nums.length>=2){amount=rec.nums[0];balance=rec.nums[rec.nums.length-1];}else amount=rec.nums[0];
    let sign = IN.test(rec.raw)?1 : OUT.test(rec.raw)?-1 : null;

    if(sign==null)sign=-1;

    if(balance!=null)prevBal=balance;
  }
  return {rows,last4};
}

function filteredLedger(){
  const pf=periodFilterFn();
  let list=activeTxns().filter(pf).filter(t=>!t.partnerPay);   // synthetic partner-payment deposits live in the Household tab, not the list
  if(ORG_BUILD&&filter.program){ list=list.filter(t=> filter.program==="__none__" ? !t.program : t.program===filter.program); }
  if(filter.q){const q=filter.q.toLowerCase().trim(); const qAmt=q.replace(/[$,\s]/g,""); const numQ=qAmt!==""&&!/[^-\d.]/.test(qAmt)&&/\d/.test(qAmt);
    list=list.filter(t=>{ const txt=((t.description||"")+" "+(t.note||"")+" "+(t.payee||"")).toLowerCase(); if(txt.includes(q))return true;
      if(numQ){ const a=Math.abs(+t.amount||0).toFixed(2); if(a.includes(qAmt)||String(t.amount).includes(qAmt))return true; } return false; });}
  if(filter.account)list=list.filter(t=>t.account===filter.account);
  if(filter.year)list=list.filter(t=>t.date.slice(0,4)===filter.year);
  if(filter.month)list=list.filter(t=>t.date.slice(5,7)===filter.month);
  if(filter.from)list=list.filter(t=>t.date>=filter.from);
  if(filter.to)list=list.filter(t=>t.date<=filter.to);
  if(filter.cats&&filter.cats.length)list=list.filter(t=> filter.cats.includes(t.category) || (t.splits&&t.splits.some(s=>filter.cats.includes(s.category))));
  if(filter.tag)list=list.filter(t=>(t.tags||[]).includes(filter.tag));
  if(filter.kind)list=list.filter(t=>catKind(t.category)===filter.kind);
  list.sort((a,b)=>{ let r; if(filter.sort==="amount")r=a.amount-b.amount; else if(filter.sort==="desc")r=(a.description||"").localeCompare(b.description||""); else r=a.date<b.date?-1:a.date>b.date?1:0; return r*filter.dir; });
  return list;
}

function buildInvoiceDocx(inv){

function importRequestRows(rows){

  const header=rows[0];

  const g={date:guess("timestamp","date"),payee:guess("payee","name"),amount:guess("amount","amt","total"),program:guess("program","project"),category:guess("category","account","type"),desc:guess("description","purpose","for","memo","what"),address:guess("address"),delivery:guess("delivery","method"),requestedBy:guess("your name","requested","email","submitted")};

  const findCat=v=>{ v=(v||"").trim().toLowerCase(); if(!v)return ""; const c=S.categories.find(c=>c.name.toLowerCase()===v)||S.categories.find(c=>c.name.toLowerCase().includes(v)||v.includes(c.name.toLowerCase())); return c?c.id:""; };
  for(const row of rows.slice(1)){
    const val=i=>i>=0?String(row[i]==null?"":row[i]).trim():"";
    const payee=val(g.payee); const amount=Math.abs(csvAmt(val(g.amount))||0);

    const ext=(val(g.date)+"|"+payee+"|"+amount).toLowerCase();

      altAddress:dv.includes("different")?val(g.address):"",requestedBy:val(g.requestedBy)});
    exist.add(ext); added++;
  }

function orgAggMonthly(fy){
  const fm=orgSettings().fyStartMonth||1; const w=orgFYWindow(fy);
  const Z=()=>Array(12).fill(0);
  const R={prog:{},ind:Z(),unRev:Z(),unDir:Z(),inv:{},fin:{},progCats:{}};
  const slot=pid=>R.prog[pid]||(R.prog[pid]={rev:Z(),dir:Z()});
  const cslot=(m,cid)=>{ const o=m[cid]||(m[cid]=Z()); return o; };
  for(const t of activeTxns()){ if(t.date<w.from||t.date>w.to)continue;
    const mi=(+t.date.slice(0,4))*12+(+t.date.slice(5,7))-(fy*12+fm); if(mi<0||mi>11)continue;
    const parts=t.splits?t.splits.map(x=>[x.category,+x.amount||0]):[[t.category,t.amount]];
    for(const [cid,a] of parts){ const c=catById(cid); if(!c)continue; const f=flowOfBucket(c.bucket); if(f!=="income"&&f!=="expense")continue;
      const act=c.act||"operating";
      if(act==="investing"){ cslot(R.inv,cid)[mi]+=a; continue; }
      if(act==="financing"){ cslot(R.fin,cid)[mi]+=a; continue; }
      const pid=t.program||null;
      if(f==="income"){ if(pid){slot(pid).rev[mi]+=a; cslot(R.progCats[pid]=R.progCats[pid]||{},cid)[mi]+=a;} else R.unRev[mi]+=a; }
      else { const spent=-a;
        if(c.di==="indirect"&&!pid){ R.ind[mi]+=spent; }
        else if(pid){ slot(pid).dir[mi]+=spent; cslot(R.progCats[pid]=R.progCats[pid]||{},cid)[mi]+=a; }
        else R.unDir[mi]+=spent; } } }
  return R;
}

function refreshLedgerBody(){

  const grand=list.reduce((a,t)=>a+t.amount,0);
  const pages=Math.max(1,Math.ceil(list.length/LEDGER_PAGE_SIZE));
  if(ledgerPage>pages)ledgerPage=pages; if(ledgerPage<1)ledgerPage=1;

/* edit / split dialog */
function editTxnDialog(id){
  const t=S.txns.find(x=>x.id===id); if(!t)return;
  const descInp=el("input",{type:"text",value:t.description||""});
  const payInp=el("input",{type:"text",value:t.payee||"",placeholder:"who was paid (for contractor 1099s)"});
  const noteInpDlg=el("textarea",{rows:"2",placeholder:"Notes for your records / audit trail"}); noteInpDlg.value=t.note||"";
  const accSel=el("select",{},...S.accounts.map(a=>{const o=el("option",{value:a.id},a.name);if(t.account===a.id)o.selected=true;return o;}));
  // tags editor
  let tags=[...(t.tags||[])];
  const tagWrap=el("div",{class:"tagedit"});
  const renderTags=()=>{ tagWrap.innerHTML="";
    tags.forEach((tg,i)=>tagWrap.append(el("span",{class:"tag"},tg,el("b",{onclick:()=>{tags.splice(i,1);renderTags();}},"×"))));
    const addSel=el("select",{onchange:e=>{ if(e.target.value){ if(!tags.includes(e.target.value))tags.push(e.target.value); renderTags(); } }},
      el("option",{value:""},"+ tag"),...S.tags.filter(x=>!tags.includes(x)).map(x=>el("option",{value:x},x)));
    tagWrap.append(addSel);
  };
  renderTags();
  // category / split (pre-seeded with the current category + full amount; button adds more)
  let splits = t.splits ? t.splits.map(s=>({...s})) : [{category:t.category||"", amount:t.amount}];
  const splitBox=el("div",{});
  const renderSplits=()=>{ splitBox.innerHTML="";
    const multi = splits.length>1; const fillBtns=[];
    if(multi) splitBox.append(el("div",{class:"muted-note",style:"margin-bottom:6px"},"Allocations must sum to "+money(t.amount)+"."));
    splits.forEach((s,i)=>{
      const cs=el("select",{onchange:e=>{ if(onCatPick(e.target,s.category,{},nid=>{s.category=nid;renderSplits();}))return; s.category=e.target.value; noteRecentCat(s.category); }}, el("option",{value:""},"— category —"), ...catOpts(s.category,{withNew:true,recent:true}));
      const row=el("div",{class:multi?"split-row":""}); row.append(cs);
      if(multi){ const am=el("input",{type:"number",step:"0.01",value:s.amount,oninput:e=>{s.amount=parseFloat(e.target.value)||0;updateSum();}}); const fb=el("button",{class:"btn sm ghost",style:"white-space:nowrap",title:"Put the leftover amount on this line so the allocations balance (can be a + or - adjustment)",onclick:()=>{ const tt=splits.reduce((a,x)=>a+(+x.amount||0),0); const rm=+(t.amount-tt).toFixed(2); s.amount=+((+s.amount||0)+rm).toFixed(2); renderSplits(); }}); fillBtns.push(fb); row.append(am,fb,
        el("button",{class:"iconbtn",title:"Remove this allocation",onclick:()=>{splits.splice(i,1);renderSplits();}},"×")); }
      splitBox.append(row);
    });
    const addBtn=el("button",{class:"btn sm",onclick:()=>{ const used=splits.reduce((a,s)=>a+(+s.amount||0),0); const rem=+(t.amount-used).toFixed(2); splits.push({category:"",amount:rem}); renderSplits(); }}, multi?"+ Add another category":"Split across more than one category");
    if(multi){ const sumEl=el("div",{class:"muted-note",id:"splitSum"}); splitBox.append(el("div",{class:"row",style:"margin-top:6px;align-items:center;gap:10px"},addBtn,sumEl)); setTimeout(updateSum,0); }
    else splitBox.append(el("div",{style:"margin-top:6px"},addBtn));
    function updateSum(){ const tot=splits.reduce((a,s)=>a+(+s.amount||0),0); const rem=+(t.amount-tot).toFixed(2); const ok=Math.abs(rem)<0.01;
      fillBtns.forEach(b=>{ if(ok){ b.disabled=true; b.textContent="✓"; } else { b.disabled=false; b.textContent="Balance"; } });
      const e=$("#splitSum"); if(e){ let txt; if(ok)txt="✓ fully allocated"; else if((t.amount>=0&&rem>0)||(t.amount<0&&rem<0))txt=money(Math.abs(rem))+" still unallocated"; else txt="over by "+money(Math.abs(rem)); e.textContent=txt; e.style.color=ok?"var(--income)":"var(--expense)";} }
  };
  renderSplits();

  const progSelT=el("select",{},el("option",{value:""},"\u2014 no program \u2014"),...(ORG_BUILD?progOpts(t.program||""):[]));
  const projSelT=el("select",{},el("option",{value:""},"\u2014 no project \u2014"),...((!ORG_BUILD&&S.projects&&S.projects.length)?S.projects.filter(x=>!x.archived||x.id===t.project).map(x=>{const o=el("option",{value:x.id},x.name);if(t.project===x.id)o.selected=true;return o;}):[]));
  openDialog("Edit transaction",[
    el("div",{style:"background:var(--surface2);color:var(--ink);padding:10px 12px;border-radius:8px;font-family:var(--mono);font-size:12.5px"},
      el("div",{},el("b",{style:"color:var(--ink)"},fmtDate(t.date))," · ",el("b",{class:"num",style:"color:var(--ink)"},signed(t.amount)))),
    el("label",{class:"fld"},"Description",descInp),
    el("label",{class:"fld"},"Payee (optional)",payInp),
    el("label",{class:"fld"},"Category",splitBox),
    ...(ORG_BUILD?[el("label",{class:"fld"},"Program",progSelT)]:[]),
    ...((!ORG_BUILD&&S.projects&&S.projects.length)?[el("label",{class:"fld"},"Project",projSelT)]:[]),
    el("label",{class:"fld"},"Account",accSel),
    el("label",{class:"fld"},"Tags",tagWrap),
    el("label",{class:"fld"},"Note (for your records / audit trail)",noteInpDlg),
  ],[
    {label:"Delete",danger:true,fn:()=>{ if(confirm("Delete this transaction?")){ S.txns=S.txns.filter(x=>x.id!==id); persist(); render(); toast("Deleted"); } }},
    {label:"Cancel"},
    {label:"Save",primary:true,keep:true,fn:()=>{
      if(splits.length>1){ const tot=splits.reduce((a,s)=>a+(+s.amount||0),0); if(Math.abs(tot-t.amount)>=0.01){toast("Allocations must sum to the transaction amount");return;} if(splits.some(s=>!s.category)){toast("Each allocation needs a category");return;} t.splits=splits; t.category=splits[0].category||null; }
      else { t.category=(splits[0]&&splits[0].category)||null; t.splits=null; }
      t.account=accSel.value; t.tags=tags; t.description=descInp.value.trim(); t.payee=payInp.value.trim(); t.note=noteInpDlg.value.trim(); if(ORG_BUILD)t.program=progSelT.value||null; if(!ORG_BUILD&&S.projects&&S.projects.length)t.project=projSelT.value||null;
      if(t.splits)t.splits.forEach(s=>noteRecentCat(s.category)); else noteRecentCat(t.category);
      persist(); closeDialog(); render(); toast("Saved",true);
    }}
  ]);
}

function inlineSplitPanel(t,onClose){

  function draw(){ rowsBox.innerHTML=""; fillBtns=[];

      const am=el("input",{type:"number",step:"0.01",value:s.amount,oninput:e=>{s.amount=parseFloat(e.target.value)||0;upd();}});
      const fb=el("button",{class:"btn sm ghost",style:"white-space:nowrap",title:"Put the leftover amount on this line so the allocations balance (can be a + or - adjustment)",onclick:()=>{ const tt=splits.reduce((a,x)=>a+(+x.amount||0),0); const rm=+(t.amount-tt).toFixed(2); s.amount=+((+s.amount||0)+rm).toFixed(2); draw(); }}); fillBtns.push(fb);
      rowsBox.append(el("div",{class:"split-row"},cs,am,fb,el("button",{class:"iconbtn",title:"Remove allocation",onclick:()=>{ if(splits.length>1){splits.splice(i,1);draw();} }},"\u00d7"))); });
    upd();
  }
  draw();
  wrap.append(rowsBox,sumEl,el("div",{class:"row",style:"gap:8px;margin-top:4px;flex-wrap:wrap"},
    el("button",{class:"btn sm",onclick:()=>{ const used=splits.reduce((a,s)=>a+(+s.amount||0),0); splits.push({category:"",amount:+(t.amount-used).toFixed(2)}); draw(); }},"+ Add allocation"),
    el("button",{class:"btn sm primary",onclick:()=>{ const tot=splits.reduce((a,s)=>a+(+s.amount||0),0); if(Math.abs(tot-t.amount)>=0.01){toast("Allocations must sum to "+money(t.amount));return;} if(splits.some(s=>!s.category)){toast("Each allocation needs a category");return;} t.splits=splits.map(s=>({category:s.category,amount:+s.amount})); t.category=splits[0].category||null; t.splits.forEach(s=>noteRecentCat(s.category)); persist(); render(); toast("Split saved",true); }},"Save split"),
    el("button",{class:"btn sm ghost",onclick:()=>{ if(onClose)onClose(); }},"Cancel")));

const SUGG_STOP=new Set("the and for with from this that into your you are was payment charge purchase pos debit credit card online store check checkcard recurring monthly autopay transfer deposit withdrawal direct bill llc inc com www the.".split(" "));
function txnKeys(t){ const keys=new Set(); const add=s=>{ (s||"").toLowerCase().split(/[^a-z]+/).forEach(w=>{ if(w.length>=4&&!SUGG_STOP.has(w)&&!/^\d+$/.test(w)) keys.add(w); }); }; add(t.note); add(t.description); return [...keys]; }

const SUGG_SKIP_NAME=/payable|receivable|\bdraw|owner|\ba\/?p\b|transfer|reimburs/i;
function categorySuggestions(){ const out=[]; const dis=new Set(suggDismissed());
  for(const c of S.categories){
    const b=BUCKETS.find(x=>x.id===c.bucket); if(b&&(b.flow==="neutral"||b.flow==="other")) continue; // skip transfers/Other
    if(SUGG_SKIP_NAME.test(c.name||"")) continue; // A/P, draws, transfers net out on both ends
    const txns=activeTxns().filter(t=>!t.dupe&&!isHHReconcile(t)&&t.category===c.id); if(txns.length<8) continue;
    const tally={}; txns.forEach(t=>{ txnKeys(t).forEach(k=>{ (tally[k]=tally[k]||{ids:new Set(),amt:0}); tally[k].ids.add(t.id); tally[k].amt+=Math.abs(t.amount); }); });
    const thresh=Math.max(3,Math.ceil(txns.length*0.30)); let best=null;
    for(const k in tally){ const cnt=tally[k].ids.size; if(cnt>=thresh&&cnt<txns.length){ if(!best||cnt>best.count||(cnt===best.count&&tally[k].amt>best.amount)) best={key:k,count:cnt,amount:tally[k].amt,ids:tally[k].ids}; } }
    if(!best) continue; if(dis.has(c.id+"::"+best.key)) continue;
    const outIds=txns.filter(t=>!best.ids.has(t.id)).map(t=>t.id);
    out.push({cat:c,key:best.key,count:best.count,amount:best.amount,ids:best.ids,outIds,total:txns.length,pct:Math.round(best.count/txns.length*100),keyIsName:(c.name||"").toLowerCase().includes(best.key)}); }
  out.sort((a,b)=>b.count-a.count); return out.slice(0,8);
}

function summarize(){

  const rows=activeTxns().filter(pf);
  const byCat={}; let inc=0,exp=0,neu=0,uncatN=0;
  const add=(catId,amt)=>{ const k=catKind(catId); const name=catId?catName(catId):"Uncategorized";
    byCat[name]=byCat[name]||{amount:0,kind:k}; byCat[name].amount+=amt;
    const [f]=flowOf(catId,amt); if(f==="inc")inc+=amt; else if(f==="exp")exp+=amt; else if(f==="neu")neu+=amt; };
  for(const t of rows){
    if(!t.category) uncatN++;
    if(t.splits){ for(const s of t.splits) add(s.category, +s.amount||0); }
    else add(t.category, t.amount);
  }
  // by tag (neutral categories excluded)

  for(const t of rows){ if(catKind(t.category)==="neutral")continue; for(const tg of (t.tags||[])){ byTag[tg]=(byTag[tg]||0)+t.amount; } }
  return {byCat,byTag,inc,exp,neu,net:inc+exp,count:rows.length,uncatN};
}

function reimbInOutCat(){ let c=S.categories.find(x=>(x.name||"").trim().toLowerCase()===REIMB_INOUT.toLowerCase()); if(!c){ c={id:uid(),name:REIMB_INOUT,bucket:"misc",form:null,deductiblePct:null,mixedUse:false}; S.categories.push(c); } return c; }

function reimbAmtOf(t,rid){ rid=rid||reimbInOutCatId(); if(!rid)return 0; const parts=t.splits?t.splits.map(s=>[s.category,+s.amount||0]):[[t.category,t.amount]]; let s=0; for(const[c,a]of parts) if(c===rid) s+=a; return s; }

function convertReimbCats(){
  const cats=reimbCatList(); if(!cats.length)return;
  const ids=new Set(cats.map(c=>c.id));

  let rc=0,tc=0;
  S.rules.forEach(r=>{ if(r.setCategory&&ids.has(r.setCategory)){ r.setCategory=home; rc++; } });
  S.txns.forEach(t=>{ if(t.category&&ids.has(t.category)){ t.category=home; tc++; } if(t.splits)t.splits.forEach(s=>{ if(s.category&&ids.has(s.category))s.category=home; }); });
  S.categories=S.categories.filter(c=>!ids.has(c.id));

}

function cfMedian(a){ const s=[...a].sort((x,y)=>x-y); const n=s.length; return n? (n%2? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2) : 0; }
function detectRecurring(){

  const byCat={};
  for(const t of activeTxns()){ const b=bucketOf(t.category); if(!t.category||!b||b==="misc"||b==="other")continue; (byCat[t.category]=byCat[t.category]||[]).push(t); }
  const ymIdx=d=>(+d.slice(0,4))*12+(+d.slice(5,7));   // absolute month index, so spans work across calendar years
  const out=[];
  for(const cid in byCat){ if(linked.has(cid))continue; const txns=byCat[cid]; if(txns.length<2)continue;
    const amts=txns.map(t=>Math.abs(t.amount)).sort((a,b)=>a-b);
    const clusters=[]; let cur=[amts[0]];
    for(let i=1;i<amts.length;i++){ const base=cur[0]; if(Math.abs(amts[i]-base)<=Math.max(2,base*0.12))cur.push(amts[i]); else {clusters.push(cur);cur=[amts[i]];} }
    clusters.push(cur); clusters.sort((x,y)=>y.length-x.length);
    const best=clusters[0]; if(best.length<2)continue;
    const rep=cfMedian(best);
    const ctx=txns.filter(t=>Math.abs(Math.abs(t.amount)-rep)<=Math.max(2,rep*0.12));
    const idxs=ctx.map(t=>ymIdx(t.date)).sort((a,b)=>a-b);
    const months=[...new Set(ctx.map(t=>+t.date.slice(5,7)))].sort((a,b)=>a-b);
    const distinctYM=new Set(idxs).size;
    if(distinctYM<2 && ctx.length<3)continue;
    const span=idxs[idxs.length-1]-idxs[0]+1; const perMonth=ctx.length/Math.max(1,span);
    let freq, mArr=[];
    if(perMonth>=3.2) freq="weekly";
    else if(perMonth>=1.6) freq="biweekly";
    else if(span>=12 && months.length<=2 && distinctYM>=2){ freq="custom"; mArr=months.slice(); }   // seasonal/annual (same month(s) recurring across years, e.g. every April)
    else if(distinctYM>=Math.max(3,Math.ceil(span*0.7))) freq="monthly";
    else if(months.join(",")==="1,4,7,10") freq="quarterly";

    out.push({categoryId:cid,name:catName(cid),kind:flow==="income"?"income":"expense",amount:Math.round(rep*100)/100,freq,months:mArr,monthsSeen:distinctYM,occ:ctx.length});

// per-week "left to work": overwork on any day spills onto the remaining days, leveling the tallest down first

function deliveryCode(){
  const byMonth={};
  const add=(m,name,mins)=>{ (byMonth[m]=byMonth[m]||{}); byMonth[m][name]=(byMonth[m][name]||0)+mins/60; };
  for(const e of S.events){ const b=S.buckets.find(x=>x.colorId===e.colorId); if(!b)continue; add(e.date.slice(0,7),b.name,e.minutes); }
  for(const x of S.manual){ const b=S.buckets.find(bb=>bb.id===x.bucketId); if(!b)continue; add(x.date.slice(0,7),b.name,x.minutes); }
  for(const m in byMonth)for(const k in byMonth[m])byMonth[m][k]=Math.round(byMonth[m][k]*100)/100;
  return JSON.stringify({tool:"sevenSkyTime",v:2,weeklyTarget:S.settings.weeklyTarget,
    buckets:S.buckets.map(b=>({name:b.name,paid:b.paid,desiredHrs:b.desiredHrs})),
    hoursByMonth:byMonth,generatedAt:new Date().toISOString().slice(0,10)},null,2);
}
function DOGET_SNIPPET(){ const cid=(S.settings.calendarId||"YOUR_CALENDAR_ID"); const origin=(S.settings.mileageOrigin||"YOUR_ORIGIN_ADDRESS");
return `var MAPS_ERR = "", MAPS_STATUS = "";

function doGet(e){
  var ORIGIN = "${origin}";        // mileage origin: the address you drive to/from
  var CALENDAR = "${cid}";         // your Google Calendar email
  var now = new Date();
  var start = new Date(now.getTime() - 1000*60*60*24*200); // ~200 days back
  var end   = new Date(now.getTime() + 1000*60*60*24*120); // ~120 days ahead
  var evs = listAllEvents(CALENDAR, start, end), out = [];
  var props = PropertiesService.getScriptProperties();
  var budget = 15;   // cap NEW Maps lookups per request so this call never times out; the rest fill in on later syncs or via warmMileageCache

  // sanity-check the origin once: if it can't be located, EVERY trip's distance fails
  var originOk = false, originStatus = "";
  try { var g = Maps.newGeocoder().geocode(ORIGIN); originStatus = g.status; originOk = (g.status === "OK" && g.results && g.results.length > 0); }
  catch (err) { originStatus = "error"; MAPS_ERR = String(err); }

  for (var i=0;i<evs.length;i++){
   try {
    var it = evs[i];
    var color = it.colorId || "";     // raw palette id straight from the Calendar API: classic 1-11, the 2026 expansion, and whatever comes next all pass through; "" = default color
    var allDay = !!(it.start && it.start.date && !it.start.dateTime);
    var d = allDay ? new Date(it.start.date + "T12:00:00") : new Date(it.start.dateTime);
    var ds = d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
    if (allDay) { out.push({ d: ds, c: color, m: 0, allDay: true }); continue; }   // all-day: hours not counted, but flagged for transparency
    if (!color) continue;             // only colored timed events are tracked
    var loc = it.location || "";
    if (/^https?:\\/\\//i.test(loc)) loc = "";   // a web link (Zoom/Meet) is not a place to drive to
    var mi = null;
    if (loc){
      var key = "mi2|" + ORIGIN + "|" + loc;
      var hit = props.getProperty(key);
      if (hit !== null && hit !== ""){ mi = parseFloat(hit); }            // a real distance is cached
      else if (budget > 0){ budget--; mi = lookupMiles(ORIGIN, loc, props, key); }   // never looked up, or a past attempt failed -> (re)try
    }
    out.push({
      d: ds,
      c: color,
      m: Math.round((new Date(it.end.dateTime) - new Date(it.start.dateTime))/60000),
      loc: loc,
      mi: mi
      // , t: it.summary              // uncomment to include titles (less private)
    });
   } catch(err){}
  }
  var cb = (e && e.parameter && e.parameter.callback) || "callback";
  var payload = { serverTime: now.toISOString(), rangeStart: start.getFullYear()+"-"+("0"+(start.getMonth()+1)).slice(-2)+"-"+("0"+start.getDate()).slice(-2), rangeEnd: end.getFullYear()+"-"+("0"+(end.getMonth()+1)).slice(-2)+"-"+("0"+end.getDate()).slice(-2), count: out.length, events: out,
    diag: { originOk: originOk, originStatus: originStatus, mapsError: MAPS_ERR, lastStatus: MAPS_STATUS } };
  return ContentService.createTextOutput(cb + "(" + JSON.stringify(payload) + ")")
    .setMimeType(ContentService.MimeType.JAVASCRIPT);
}

// Reads events through the Calendar API advanced service so EVERY event color comes through,
// including the colors Google added in 2026. Requires the "Google Calendar API" service to be
// added to the project (in the editor: Services + -> Google Calendar API -> Add).
function listAllEvents(calId, start, end){
  var items = [], token = null;
  do {
    var resp = Calendar.Events.list(calId, { timeMin: start.toISOString(), timeMax: end.toISOString(),
      singleEvents: true, maxResults: 2500, pageToken: token });
    items = items.concat(resp.items || []);
    token = resp.nextPageToken;
  } while (token);
  return items;
}

// One round-trip distance (origin -> destination and back). Caches ONLY a successful result, so a
// temporary failure (Google's daily Maps limit, a timeout) is retried next time instead of being stuck "pending".
function lookupMiles(origin, dest, props, key){
  try {
    var dir = Maps.newDirectionFinder().setOrigin(origin).setDestination(dest).getDirections();
    MAPS_STATUS = dir.status;
    if (dir.status === "OK" && dir.routes && dir.routes.length){
      var meters = 0, legs = dir.routes[0].legs;
      for (var j=0;j<legs.length;j++) meters += legs[j].distance.value;
      var val = String(+((meters/1609.34) * 2).toFixed(2));
      props.setProperty(key, val);   // cache the good answer
      return parseFloat(val);
    }
    return null;                      // Maps answered but couldn't route this one -> leave uncached so a corrected address resolves later
  } catch (err) {
    MAPS_ERR = String(err);           // quota/timeout/etc -> leave uncached and retry next run
    return null;
  }
}

// RECOMMENDED: in the editor, pick warmMileageCache from the function dropdown and click Run once.
// (The first Run asks you to authorize; after authorizing, click Run again.) It looks up every trip
// whose distance isn't cached yet, INCLUDING ones that failed before, so your miles fill in.
function warmMileageCache(){
  var ORIGIN = "${origin}";
  var CALENDAR = "${cid}";
  var now = new Date();
  var evs = listAllEvents(CALENDAR, new Date(now.getTime()-1000*60*60*24*200), new Date(now.getTime()+1000*60*60*24*120));
  var props = PropertiesService.getScriptProperties();
  for (var i=0;i<evs.length;i++){
    var it = evs[i];
    if ((it.start && it.start.date && !it.start.dateTime) || !it.colorId) continue;
    var loc = it.location || "";
    if (/^https?:\\/\\//i.test(loc)) continue;
    if (!loc) continue;
    var key = "mi2|" + ORIGIN + "|" + loc;
    var v = props.getProperty(key);
    if (v === null || v === "") lookupMiles(ORIGIN, loc, props, key);   // (re)try anything not yet resolved
  }
}`;
}
